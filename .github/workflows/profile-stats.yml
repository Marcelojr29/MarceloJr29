name: Update profile stats cards

on:
  schedule:
    - cron: "0 3 * * *" # todo dia às 03:00 UTC
  workflow_dispatch: # permite rodar manualmente pela aba Actions
  push:
    paths:
      - ".github/workflows/profile-stats.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Gerar card de stats
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=Marcelojr29&show_icons=true&theme=tokyonight&border_radius=10"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar card de linguagens
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=Marcelojr29&layout=compact&langs_count=7&theme=tokyonight&border_radius=10"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar card de streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=Marcelojr29&theme=tokyonight&border_radius=10"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commitar os cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Atualiza cards de stats do perfil" || exit 0
          git push
